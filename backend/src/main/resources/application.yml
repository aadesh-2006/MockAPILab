server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: mockapilab-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mockapilab}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:mockapilab_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:mockapilab_password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:mockapilab-generation-workers}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

mockapilab:
  jwt:
    secret: ${JWT_SECRET:mockapilab-default-development-secret-key-must-be-at-least-256-bits-long-for-hmac-sha}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  runtime:
    state-store: ${RUNTIME_STATE_STORE:redis}
  kafka:
    create-topics: ${KAFKA_CREATE_TOPICS:true}
    consumer:
      auto-startup: ${KAFKA_CONSUMER_AUTO_STARTUP:true}
    topics:
      generation-jobs: ${KAFKA_GENERATION_JOBS_TOPIC:mockapi.generation.jobs}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.mockapilab: DEBUG
