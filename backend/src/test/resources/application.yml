server:
  port: 8080

spring:
  application:
    name: mockapilab-backend-test
  datasource:
    url: jdbc:h2:mem:mockapilab_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

mockapilab:
  jwt:
    secret: test-jwt-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-testing-suite
    expiration-ms: 3600000
  runtime:
    state-store: in-memory
  kafka:
    create-topics: false
    producer:
      enabled: false
    consumer:
      auto-startup: false
    topics:
      generation-jobs: mockapi.generation.jobs.test
  ai:
    gemini:
      api-key: test-gemini-mock-api-key
      model: gemini-1.5-flash
      timeout-seconds: 5
      base-url: http://localhost:9999/gemini-mock

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: false

logging:
  level:
    root: INFO
    com.mockapilab: DEBUG
    org.flywaydb: INFO