server:
  port: 8080

spring:
  application:
    name: mockapilab-backend-test
  datasource:
    url: jdbc:h2:mem:mockapilab_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

mockapilab:
  jwt:
    secret: test-jwt-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-testing-suite
    expiration-ms: 3600000
  runtime:
    state-store: in-memory
  kafka:
    create-topics: false
    producer:
      enabled: false
    consumer:
      auto-startup: false
    topics:
      generation-jobs: mockapi.generation.jobs.test

logging:
  level:
    root: INFO
    com.mockapilab: DEBUG
    org.flywaydb: DEBUG