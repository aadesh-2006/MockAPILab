version: '3.8'

services:
  # =========================================================================
  # Primary Relational Store (PostgreSQL) - Planned System of Record
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mockapilab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mockapilab}
      POSTGRES_USER: ${POSTGRES_USER:-mockapilab_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mockapilab_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mockapilab_user} -d ${POSTGRES_DB:-mockapilab}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mockapilab-network

  # =========================================================================
  # Stateful Mock Cache & In-Memory Store (Redis) - Planned Runtime State
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: mockapilab-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mockapilab-network

  # =========================================================================
  # Event Streaming & Async Telemetry (Apache Kafka - KRaft Mode)
  # =========================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: mockapilab-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - mockapilab-network

  # =========================================================================
  # Backend Service (Spring Boot Modular Monolith)
  # =========================================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mockapilab-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mockapilab}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mockapilab_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mockapilab_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mockapilab-network
    profiles:
      - full-stack

  # =========================================================================
  # Frontend Service (React + Vite Dashboard)
  # =========================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: mockapilab-frontend
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - mockapilab-network
    profiles:
      - full-stack

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local

networks:
  mockapilab-network:
    driver: bridge
